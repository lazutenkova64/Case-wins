<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Частушки с озвучкой</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Georgia", serif;
    background: linear-gradient(135deg, #fdf6e3 0%, #ffe9c7 100%);
    color: #3a2a1a;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 40px 20px 20px;
  }
  header h1 {
    margin: 0;
    font-size: 2.6rem;
    color: #b3452a;
    text-shadow: 2px 2px 0 #fff3d9;
  }
  header p { margin: 8px 0 0; color: #7a5a3a; font-style: italic; }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px;
  }

  /* Форма */
  .compose {
    background: #fffaf0;
    border: 2px dashed #d8a25b;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 30px;
    box-shadow: 0 6px 18px rgba(180,120,60,.15);
  }
  .compose h2 {
    margin: 0 0 12px;
    font-size: 1.3rem;
    color: #b3452a;
  }
  .compose textarea {
    width: 100%;
    min-height: 110px;
    padding: 12px;
    font-family: inherit;
    font-size: 1.05rem;
    line-height: 1.5;
    border: 2px solid #e6c89a;
    border-radius: 10px;
    resize: vertical;
    background: #fffdf8;
    color: #3a2a1a;
    outline: none;
    transition: border-color .2s;
  }
  .compose textarea:focus { border-color: #b3452a; }
  .compose .actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 1rem;
    font-family: inherit;
    transition: transform .1s, background .2s;
  }
  button:active { transform: scale(.97); }
  .btn-primary {
    background: #b3452a;
    color: #fff;
  }
  .btn-primary:hover { background: #93351e; }
  .btn-secondary {
    background: #e6c89a;
    color: #5a3a1a;
  }
  .btn-secondary:hover { background: #d8b478; }

  /* Посты */
  .post {
    background: #fffaf0;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 22px;
    box-shadow: 0 6px 18px rgba(180,120,60,.15);
    border-left: 6px solid #b3452a;
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .post .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: .85rem;
    color: #9a7a5a;
    margin-bottom: 10px;
  }
  .post .text {
    font-size: 1.15rem;
    line-height: 1.6;
    white-space: pre-wrap;
    margin-bottom: 14px;
  }
  .post .text::before { content: "🎵 "; }

  audio { width: 100%; margin-top: 4px; }

  .empty-hint {
    text-align: center;
    color: #9a7a5a;
    font-style: italic;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <h1>🎶 Частушки с озвучкой</h1>
  <p>Слушай, сочиняй и озвучивай свои частушки</p>
</header>

<div class="container">

  <!-- Форма добавления -->
  <div class="compose">
    <h2>Сочинить частушку</h2>
    <textarea id="userText" placeholder="Например:&#10;Я надену сарафан,&#10;Заиграю на гармошке,&#10;Пусть танцует весь Иван,&#10;И соседские три кошки!"></textarea>
    <div class="actions">
      <button class="btn-primary" onclick="savePost()">💾 Сохранить и озвучить</button>
      <button class="btn-secondary" onclick="previewVoice()">🔊 Прослушать</button>
      <button class="btn-secondary" onclick="document.getElementById('userText').value=''">🧹 Очистить</button>
    </div>
  </div>

  <!-- Лента постов -->
  <div id="feed"></div>
</div>

<script>
/* ---------- Начальные посты ---------- */
/* В поле audio можно указать ссылку на mp3-файл.
   Если ссылки нет — плеер озвучит текст автоматически. */
const initialPosts = [
  {
    text: "Я надену сарафан,\nЗаиграю на гармошке,\nПусть танцует весь Иван,\nИ соседские три кошки!",
    author: "Народная",
    audio: null
  },
  {
    text: "Милая моя подружка,\nДай мне пряник на дорожку,\nЯ иду плясать в село,\nЧтобы вечером свело!",
    author: "Народная",
    audio: null
  },
  {
    text: "На горе стоит берёза,\nПод берёзой — самовар,\nПриходи ко мне, милёнок,\nПить с малиною отвар!",
    author: "Народная",
    audio: null
  }
];

/* ---------- Работа с лентой ---------- */
const feed = document.getElementById('feed');

function renderPost(post, prepend = false) {
  const el = document.createElement('div');
  el.className = 'post';

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span>✍️ ${post.author}</span><span>${new Date().toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span>`;

  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = post.text;

  el.appendChild(meta);
  el.appendChild(text);

  // Плеер
  const audio = document.createElement('audio');
  audio.controls = true;
  if (post.audio) {
    audio.src = post.audio;
  } else {
    // Нет файла — озвучим через синтез речи
    // Скрываем нативный плеер и создаём кнопку
    audio.style.display = 'none';
    const btn = document.createElement('button');
    btn.className = 'btn-secondary';
    btn.textContent = '🔊 Озвучить';
    btn.onclick = () => speak(post.text);
    el.appendChild(btn);
  }
  el.appendChild(audio);

  if (prepend && feed.firstChild) {
    feed.insertBefore(el, feed.firstChild);
  } else {
    feed.appendChild(el);
  }
}

/* ---------- Сохранение своего поста ---------- */
function savePost() {
  const ta = document.getElementById('userText');
  const text = ta.value.trim();
  if (!text) {
    alert('Сначала напиши частушку!');
    return;
  }

  // Создаём пост со своим текстом.
  // Здесь нет mp3 — плеер озвучит текст автоматически.
  const post = {
    text: text,
    author: 'Ты',
    audio: null
  };

  renderPost(post, true);
  ta.value = '';
  post.scrollIntoView?.({ behavior: 'smooth' });
  // Автоматически озвучим
  speak(text);
}

/* ---------- Предпросмотр озвучки ---------- */
function previewVoice() {
  const text = document.getElementById('userText').value.trim();
  if (!text) {
    alert('Напиши текст для прослушивания!');
    return;
  }
  speak(text);
}

/* ---------- Синтез речи (Web Speech API) ---------- */
function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('К сожалению, ваш браузер не поддерживает синтез речи.');
    return;
  }
  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ru-RU';
  utter.rate = 0.95;
  utter.pitch = 1.1;

  // Пытаемся найти русский голос
  const voices = window.speechSynthesis.getVoices();
  const ru = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  if (ru) utter.voice = ru;

  window.speechSynthesis.speak(utter);
}

// Подгружаем голоса (в некоторых браузерах асинхронно)
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

/* ---------- Первичная отрисовка ---------- */
initialPosts.forEach(p => renderPost(p));
</script>

</body>
</html>
