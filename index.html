<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звуковая клавиатура 🎹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 15% 20%, #2d1b4e 0%, transparent 45%),
                        radial-gradient(circle at 85% 80%, #1b3a4e 0%, transparent 45%),
                        linear-gradient(135deg, #0a0612 0%, #050308 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        
        h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00e5ff, #b14aff, #ff4a8d, #ffb84a);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 4s linear infinite;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        @keyframes shine {
            to { background-position: 300% center; }
        }
        
        .subtitle {
            color: #8899bb;
            font-size: 0.95em;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 30px 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .key {
            width: 62px;
            height: 62px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            position: relative;
            background: linear-gradient(145deg, #2a2a3e, #1a1a2a);
            color: #e0e5ff;
            font-size: 1.3em;
            font-weight: 700;
            letter-spacing: 1px;
            transition: transform 0.08s, box-shadow 0.15s, background 0.2s;
            box-shadow: 
                0 5px 0 #0d0d16,
                0 8px 15px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        
        .key .emoji {
            font-size: 1.1em;
            line-height: 1;
            opacity: 0.9;
            filter: drop-shadow(0 0 4px currentColor);
        }
        
        .key .letter {
            font-size: 0.95em;
            line-height: 1;
            opacity: 0.85;
        }
        
        .key::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, var(--glow, rgba(255,255,255,0.2)), transparent 70%);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .key:hover {
            background: linear-gradient(145deg, #343450, #22223a);
            transform: translateY(-2px);
            box-shadow: 
                0 7px 0 #0d0d16,
                0 10px 20px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        
        .key:hover::before { opacity: 1; }
        
        .key:active, .key.pressed {
            transform: translateY(4px);
            box-shadow: 
                0 1px 0 #0d0d16,
                0 2px 6px rgba(0, 0, 0, 0.5),
                inset 0 2px 8px rgba(0, 0, 0, 0.5);
            background: linear-gradient(145deg, #1a1a2a, #2a2a3e);
            color: #fff;
        }
        
        .key.pressed .emoji {
            filter: drop-shadow(0 0 12px currentColor) drop-shadow(0 0 6px currentColor);
        }
        
        /* Отдельные цвета для каждой буквы */
        .key[data-letter="А"] { --glow: rgba(255, 90, 90, 0.6); color: #ff5a5a; }
        .key[data-letter="Б"] { --glow: rgba(255, 150, 60, 0.6); color: #ff963c; }
        .key[data-letter="В"] { --glow: rgba(255, 210, 60, 0.6); color: #ffd23c; }
        .key[data-letter="Г"] { --glow: rgba(150, 220, 60, 0.6); color: #96dc3c; }
        .key[data-letter="Д"] { --glow: rgba(60, 220, 120, 0.6); color: #3cdc78; }
        .key[data-letter="Е"] { --glow: rgba(60, 220, 200, 0.6); color: #3cdcc8; }
        .key[data-letter="Ж"] { --glow: rgba(60, 170, 255, 0.6); color: #3caaff; }
        .key[data-letter="З"] { --glow: rgba(90, 120, 255, 0.6); color: #5a78ff; }
        .key[data-letter="И"] { --glow: rgba(150, 90, 255, 0.6); color: #965aff; }
        .key[data-letter="К"] { --glow: rgba(210, 90, 255, 0.6); color: #d25aff; }
        .key[data-letter="Л"] { --glow: rgba(255, 90, 200, 0.6); color: #ff5ac8; }
        .key[data-letter="М"] { --glow: rgba(255, 90, 130, 0.6); color: #ff5a82; }
        
        .key[data-letter="Н"] { --glow: rgba(220, 120, 90, 0.6); color: #dc785a; }
        .key[data-letter="О"] { --glow: rgba(200, 180, 90, 0.6); color: #c8b45a; }
        .key[data-letter="П"] { --glow: rgba(140, 200, 90, 0.6); color: #8cc85a; }
        .key[data-letter="Р"] { --glow: rgba(90, 200, 150, 0.6); color: #5ac896; }
        .key[data-letter="С"] { --glow: rgba(90, 200, 220, 0.6); color: #5ac8dc; }
        .key[data-letter="Т"] { --glow: rgba(90, 160, 220, 0.6); color: #5aa0dc; }
        .key[data-letter="У"] { --glow: rgba(120, 110, 240, 0.6); color: #786ef0; }
        .key[data-letter="Ф"] { --glow: rgba(170, 100, 240, 0.6); color: #aa64f0; }
        .key[data-letter="Х"] { --glow: rgba(220, 100, 220, 0.6); color: #dc64dc; }
        .key[data-letter="Ц"] { --glow: rgba(240, 100, 170, 0.6); color: #f064aa; }
        .key[data-letter="Ч"] { --glow: rgba(240, 130, 130, 0.6); color: #f08282; }
        
        .key[data-letter="Ш"] { --glow: rgba(255, 180, 100, 0.6); color: #ffb464; }
        .key[data-letter="Щ"] { --glow: rgba(230, 220, 100, 0.6); color: #e6dc64; }
        .key[data-letter="Ъ"] { --glow: rgba(150, 230, 130, 0.6); color: #96e682; }
        .key[data-letter="Ы"] { --glow: rgba(100, 230, 190, 0.6); color: #64e6be; }
        .key[data-letter="Ь"] { --glow: rgba(100, 200, 240, 0.6); color: #64c8f0; }
        .key[data-letter="Э"] { --glow: rgba(130, 140, 255, 0.6); color: #828cff; }
        .key[data-letter="Ю"] { --glow: rgba(180, 120, 255, 0.6); color: #b478ff; }
        .key[data-letter="Я"] { --glow: rgba(230, 110, 230, 0.6); color: #e66ee6; }
        
        .hint {
            margin-top: 25px;
            color: #6a7a99;
            font-size: 0.85em;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .hint kbd {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            padding: 2px 8px;
            font-family: monospace;
            color: #b0c0e0;
        }
        
        /* Индикатор звука */
        .now-playing {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 20px;
            color: #fff;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        
        .now-playing.show { opacity: 1; }
        
        .now-playing .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        @media (max-width: 720px) {
            h1 { font-size: 1.5em; }
            .key { width: 48px; height: 48px; font-size: 1em; border-radius: 10px; }
            .key .emoji { font-size: 0.9em; }
            .keyboard { gap: 7px; padding: 18px 12px; }
            .row { gap: 7px; }
        }
        
        @media (max-width: 520px) {
            .key { width: 38px; height: 38px; font-size: 0.85em; }
            .key .emoji { display: none; }
            .key .letter { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <h1>Звуковая клавиатура</h1>
    <p class="subtitle">Каждая буква — свой уникальный звук 🎵</p>
    
    <div class="keyboard" id="keyboard"></div>
    
    <p class="hint">Также можно нажимать клавиши на <kbd>реальной клавиатуре</kbd></p>
    
    <div class="now-playing" id="nowPlaying">
        <span class="dot"></span>
        <span id="nowText">—</span>
    </div>
    
    <script>
        // ============ АУДИО КОНТЕКСТ ============
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }
        
        // ============ ГЕНЕРАТОРЫ ЗВУКОВ ============
        
        // Вспомогательная функция: белый шум
        function createNoise(duration) {
            const ctx = audioCtx;
            const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }
        
        // Кашель — короткий шумовой выброс с фильтром
        function soundCough() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const noise = ctx.createBufferSource();
            noise.buffer = createNoise(0.3);
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(800, now);
            filter.frequency.exponentialRampToValueAtTime(200, now + 0.25);
            filter.Q.value = 1.5;
            
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.5, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.5, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            
            // Низкий "горловой" тон
            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
            oscGain.gain.setValueAtTime(0.2, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(oscGain);
            oscGain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }
        
        // Скример — резкий высокий крик
        function soundScream() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(2200, now + 0.1);
            osc.frequency.exponentialRampToValueAtTime(1500, now + 0.5);
            
            const vibrato = ctx.createOscillator();
            const vibratoGain = ctx.createGain();
            vibrato.frequency.value = 30;
            vibratoGain.gain.value = 60;
            vibrato.connect(vibratoGain);
            vibratoGain.connect(osc.frequency);
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.35, now + 0.02);
            gain.gain.setValueAtTime(0.35, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            vibrato.start(now);
            osc.stop(now + 0.6);
            vibrato.stop(now + 0.6);
        }
        
        // Вода — булькающие капли
        function soundWater() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            for (let i = 0; i < 5; i++) {
                const t = now + i * 0.08;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                const baseFreq = 400 + Math.random() * 800;
                osc.frequency.setValueAtTime(baseFreq, t);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.8, t + 0.05);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, t + 0.1);
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.15, t + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.13);
            }
        }
        
        // Ветер — фильтрованный шум
        function soundWind() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const noise = ctx.createBufferSource();
            noise.buffer = createNoise(1.5);
            noise.loop = true;
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(300, now);
            filter.frequency.exponentialRampToValueAtTime(900, now + 0.7);
            filter.frequency.exponentialRampToValueAtTime(400, now + 1.5);
            filter.Q.value = 3;
            
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.25, now + 0.3);
            gain.gain.setValueAtTime(0.25, now + 1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            noise.stop(now + 1.5);
        }
        
        // Гром / взрыв
        function soundThunder() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const noise = ctx.createBufferSource();
            noise.buffer = createNoise(1.2);
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + 1);
            
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.6, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
            
            // Низкий гул
            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 1);
            oscGain.gain.setValueAtTime(0.5, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
            osc.connect(oscGain);
            oscGain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 1.2);
        }
        
        // Птица — чириканье
        function soundBird() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            for (let i = 0; i < 3; i++) {
                const t = now + i * 0.12;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                const f = 2000 + Math.random() * 1500;
                osc.frequency.setValueAtTime(f, t);
                osc.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.04);
                osc.frequency.exponentialRampToValueAtTime(f * 0.9, t + 0.09);
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.15, t + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.11);
            }
        }
        
        // Дверной скрип
        function soundCreak() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(350, now + 0.8);
            
            const tremolo = ctx.createOscillator();
            const tremoloGain = ctx.createGain();
            tremolo.frequency.value = 15;
            tremoloGain.gain.value = 40;
            tremolo.connect(tremoloGain);
            tremoloGain.connect(osc.frequency);
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800;
            filter.Q.value = 8;
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
            gain.gain.setValueAtTime(0.2, now + 0.6);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            tremolo.start(now);
            osc.stop(now + 0.9);
            tremolo.stop(now + 0.9);
        }
        
        // Смех — серия коротких импульсов
        function soundLaugh() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            for (let i = 0; i < 5; i++) {
                const t = now + i * 0.15;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                const f = 300 + Math.random() * 100;
                osc.frequency.setValueAtTime(f * 1.5, t);
                osc.frequency.exponentialRampToValueAtTime(f, t + 0.1);
                
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.2, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.13);
            }
        }
        
        // Плач
        function soundCry() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.linearRampToValueAtTime(400, now + 0.4);
            osc.frequency.linearRampToValueAtTime(550, now + 0.8);
            
            const vibrato = ctx.createOscillator();
            const vibratoGain = ctx.createGain();
            vibrato.frequency.value = 6;
            vibratoGain.gain.value = 30;
            vibrato.connect(vibratoGain);
            vibratoGain.connect(osc.frequency);
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1500;
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
            gain.gain.setValueAtTime(0.15, now + 0.7);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            vibrato.start(now);
            osc.stop(now + 0.9);
            vibrato.stop(now + 0.9);
        }
        
        // Лазер
        function soundLaser() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(2000, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
            
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }
        
        // Колокольчик
        function soundBell() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            [1200, 1800, 2400].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = f;
                gain.gain.setValueAtTime(0.15 / (i + 1), now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 1);
            });
        }
        
        // Собака — гав
        function soundDog() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.15);
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1500, now);
            filter.frequency.exponentialRampToValueAtTime(400, now + 0.15);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }
        
        // Кошка — мяу
        function soundCat() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.linearRampToValueAtTime(700, now + 0.15);
            osc.frequency.linearRampToValueAtTime(400, now + 0.5);
            
            const vibrato = ctx.createOscillator();
            const vibratoGain = ctx.createGain();
            vibrato.frequency.value = 12;
            vibratoGain.gain.value = 25;
            vibrato.connect(vibratoGain);
            vibratoGain.connect(osc.frequency);
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;
            filter.Q.value = 2;
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
            gain.gain.setValueAtTime(0.15, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            vibrato.start(now);
            osc.stop(now + 0.55);
            vibrato.stop(now + 0.55);
        }
        
        // Пулемёт — быстрые щелчки
        function soundMachineGun() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            for (let i = 0; i < 8; i++) {
                const t = now + i * 0.06;
                const noise = ctx.createBufferSource();
                noise.buffer = createNoise(0.05);
                
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                filter.Q.value = 1;
                
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.25, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(t);
            }
        }
        
        // Взрыв
        function soundExplosion() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const noise = ctx.createBufferSource();
            noise.buffer = createNoise(1);
            
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(3000, now);
            filter.frequency.exponentialRampToValueAtTime(50, now + 0.8);
            
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start(now);
        }
        
        // Часы — тик-так
        function soundClock() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            for (let i = 0; i < 4; i++) {
                const t = now + i * 0.25;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.value = i % 2 === 0 ? 2000 : 1500;
                
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.03);
            }
        }
        
        // Капля
        function soundDrop() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }
        
        // Робот
        function soundRobot() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            for (let i = 0; i < 6; i++) {
                const t = now + i * 0.05;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.value = 200 + Math.random() * 1500;
                
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.04);
            }
        }
        
        // Сердцебиение
        function soundHeartbeat() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            [0, 0.25].forEach((delay, i) => {
                const t = now + delay;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(80, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
                
                gain.gain.setValueAtTime(0.5 / (i + 1), t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.2);
            });
        }
        
        // Барабан
        function soundDrum() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
            
            // Атака
            const noise = ctx.createBufferSource();
            noise.buffer = createNoise(0.05);
            const nGain = ctx.createGain();
            nGain.gain.setValueAtTime(0.2, now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            noise.connect(nGain);
            nGain.connect(ctx.destination);
            noise.start(now);
        }
        
        // Стекло — звон разбитого стекла
        function soundGlass() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            [2400, 3200, 4000, 2800].forEach((f, i) => {
                const t = now + i * 0.03;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = f + Math.random() * 400;
                
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.4);
            });
            
            const noise = ctx.createBufferSource();
            noise.buffer = createNoise(0.2);
            const nGain = ctx.createGain();
            const nFilter = ctx.createBiquadFilter();
            nFilter.type = 'highpass';
            nFilter.frequency.value = 3000;
            nGain.gain.setValueAtTime(0.3, now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            noise.connect(nFilter);
            nFilter.connect(nGain);
            nGain.connect(ctx.destination);
            noise.start(now);
        }
        
        // Свисток
        function soundWhistle() {
            const ctx = audioCtx;
            const now = ctx.currentTime;
            
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1800, now);
            osc.frequency.linearRampToValueAtTime(2400, now + 0.15);
            osc.frequency.linearRampToValueAtTime(1600, now + 0.4);
            
            const vib = ctx.createOscillator();
            const vibGain = ctx.createGain();
            vib.frequency.value = 20;
            vibGain.gain.value = 40;
            vib.connect(vibGain);
            vibGain.connect(osc.frequency);
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
            gain.gain.setValueAtTime(0.2, now + 0.35);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            vib.start(now);
            osc.stop(now + 0.45);
            vib.stop(now + 0.45);
        }
        
        // ============ РАСКЛАДКА ============
        // Каждая буква → { sound: функция, emoji: символ, name: название }
        const keys = [
            { letter: 'А', sound: soundCough, emoji: '🤧', name: 'Кашель' },
            { letter: 'Б', sound: soundScream, emoji: '😱', name: 'Скример' },
            { letter: 'В', sound: soundWater, emoji: '💧', name: 'Вода' },
            { letter: 'Г', sound: soundWind, emoji: '🌬️', name: 'Ветер' },
            { letter: 'Д', sound: soundThunder, emoji: '⛈️', name: 'Гром' },
            { letter: 'Е', sound: soundBird, emoji: '🐦', name: 'Птица' },
            { letter: 'Ж', sound: soundCreak, emoji: '🚪', name: 'Скрип' },
            { letter: 'З', sound: soundLaugh, emoji: '😄', name: 'Смех' },
            { letter: 'И', sound: soundCry, emoji: '😭', name: 'Плач' },
            { letter: 'К', sound: soundLaser, emoji: '🔫', name: 'Лазер' },
            { letter: 'Л', sound: soundBell, emoji: '🔔', name: 'Колокол' },
            { letter: 'М', sound: soundDog, emoji: '🐶', name: 'Собака' },
            { letter: 'Н', sound: soundCat, emoji: '🐱', name: 'Кошка' },
            { letter: 'О', sound: soundMachineGun, emoji: '💥', name: 'Пулемёт' },
            { letter: 'П', sound: soundExplosion, emoji: '💣', name: 'Взрыв' },
            { letter: 'Р', sound: soundClock, emoji: '🕐', name: 'Часы' },
            { letter: 'С', sound: soundDrop, emoji: '💦', name: 'Капля' },
            { letter: 'Т', sound: soundRobot, emoji: '🤖', name: 'Робот' },
            { letter: 'У', sound: soundHeartbeat, emoji: '❤️', name: 'Сердце' },
            { letter: 'Ф', sound: soundDrum, emoji: '🥁', name: 'Барабан' },
            { letter: 'Х', sound: soundGlass, emoji: '🥂', name: 'Стекло' },
            { letter: 'Ц', sound: soundWhistle, emoji: '🎵', name: 'Свист' },
            { letter: 'Ч', sound: soundScream, emoji: '👻', name: 'Крик' },
            { letter: 'Ш', sound: soundWind, emoji: '🍃', name: 'Шорох' },
            { letter: 'Щ', sound: soundWater, emoji: '🌊', name: 'Волна' },
            { letter: 'Ъ', sound: soundThunder, emoji: '⚡', name: 'Молния' },
            { letter: 'Ы', sound: soundCough, emoji: '😷', name: 'Хрип' },
            { letter: 'Ь', sound: soundDrop, emoji: '🚰', name: 'Кран' },
            { letter: 'Э', sound: soundLaser, emoji: '⚡', name: 'Разряд' },
            { letter: 'Ю', sound: soundBell, emoji: '🎐', name: 'Звон' },
            { letter: 'Я', sound: soundCry, emoji: '😢', name: 'Всхлип' },
        ];
        
        // Разбиваем на ряды по 11 (как на клавиатуре)
        const layout = [];
        for (let i = 0; i < keys.length; i += 11) {
            layout.push(keys.slice(i, i + 11));
        }
        
        // ============ СОЗДАНИЕ КЛАВИАТУРЫ ============
        const keyboardEl = document.getElementById('keyboard');
        const nowPlayingEl = document.getElementById('nowPlaying');
        const nowTextEl = document.getElementById('nowText');
        let hideTimeout = null;
        
        const keyElements = {};
        
        layout.forEach(rowData => {
            const row = document.createElement('div');
            row.className = 'row';
            
            rowData.forEach(keyData => {
                const btn = document.createElement('button');
                btn.className = 'key';
                btn.dataset.letter = keyData.letter;
                
                btn.innerHTML = `
                    <span class="emoji">${keyData.emoji}</span>
                    <span class="letter">${keyData.letter}</span>
                `;
                
                btn.addEventListener('click', () => {
                    initAudio();
                    keyData.sound();
                    showNowPlaying(keyData.name);
                    animateKey(btn);
                });
                
                row.appendChild(btn);
                keyElements[keyData.letter] = { el: btn, data: keyData };
            });
            
            keyboardEl.appendChild(row);
        });
        
        // ============ АНИМАЦИЯ ============
        function animateKey(el) {
            el.classList.add('pressed');
            setTimeout(() => el.classList.remove('pressed'), 150);
        }
        
        function showNowPlaying(name) {
            nowTextEl.textContent = name;
            nowPlayingEl.classList.add('show');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                nowPlayingEl.classList.remove('show');
            }, 1200);
        }
        
        // ============ РЕАЛЬНАЯ КЛАВИАТУРА ============
        document.addEventListener('keydown', (e) => {
            // Игнорируем повторные срабатывания
            if (e.repeat) return;
            
            const key = e.key.toUpperCase();
            const entry = keyElements[key];
            
            if (entry) {
                initAudio();
                entry.data.sound();
                showNowPlaying(entry.data.name);
                animateKey(entry.el);
            }
        });
        
        // Инициализация по первому клику
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });
        document.addEventListener('keydown', initAudio, { once: true });
    </script>
</body>
</html>
