<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop It! 🫧</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #ff6ec4 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, #7873f5 0%, transparent 50%),
                        linear-gradient(135deg, #1a0033 0%, #0d001a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s linear infinite;
            text-align: center;
            letter-spacing: 2px;
        }
        
        @keyframes shine {
            to { background-position: 200% center; }
        }
        
        .counter {
            color: #fff;
            font-size: 1.1em;
            margin-bottom: 25px;
            opacity: 0.8;
            text-align: center;
        }
        
        .counter b {
            color: #4adede;
            font-size: 1.3em;
        }
        
        .board {
            display: grid;
            gap: 12px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        inset 0 0 60px rgba(255, 110, 196, 0.1);
        }
        
        .bubble {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s, box-shadow 0.15s;
            background: radial-gradient(circle at 30% 30%, 
                        var(--light), 
                        var(--base) 60%, 
                        var(--dark));
            box-shadow: 
                inset -6px -6px 12px rgba(0, 0, 0, 0.3),
                inset 6px 6px 12px rgba(255, 255, 255, 0.4),
                0 6px 15px rgba(0, 0, 0, 0.4),
                0 0 20px var(--glow);
            animation: float 3s ease-in-out infinite;
        }
        
        .bubble::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 25%;
            height: 25%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            filter: blur(2px);
        }
        
        .bubble:hover {
            transform: scale(1.08);
        }
        
        .bubble:active {
            transform: scale(0.95);
        }
        
        .bubble.pop {
            animation: pop 0.4s forwards;
            cursor: default;
        }
        
        @keyframes pop {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.3);
                filter: brightness(1.5);
            }
            100% {
                transform: scale(0.75);
                opacity: 0.4;
                box-shadow: 
                    inset 0 0 20px rgba(0, 0, 0, 0.6),
                    0 2px 5px rgba(0, 0, 0, 0.3);
                filter: grayscale(0.5) brightness(0.6);
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) var(--scale, scale(1)); }
            50% { transform: translateY(-3px) var(--scale, scale(1)); }
        }
        
        .bubble.pop {
            animation: pop 0.4s forwards;
        }
        
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button.ctrl {
            background: linear-gradient(135deg, #ff6ec4, #7873f5);
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(255, 110, 196, 0.4);
        }
        
        button.ctrl:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 110, 196, 0.6);
        }
        
        button.ctrl:active {
            transform: translateY(0);
        }
        
        /* Плавающие пузырьки на фоне */
        .bg-bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            animation: rise linear infinite;
            bottom: -100px;
        }
        
        @keyframes rise {
            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .bubble { width: 55px; height: 55px; }
            .board { gap: 8px; padding: 15px; }
        }
    </style>
</head>
<body>
    <h1>Pop It! 🫧</h1>
    <div class="counter">Пузырьков лопнуто: <b id="count">0</b></div>
    
    <div class="board" id="board"></div>
    
    <div class="controls">
        <button class="ctrl" id="resetBtn">🔄 Сбросить</button>
    </div>
    
    <script>
        // ============ ЗВУКИ (Web Audio API) ============
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        // Звук лопающегося пузырька
        function playPopSound(pitch = 1) {
            initAudio();
            const now = audioCtx.currentTime;
            
            // Основной "щелчок" — быстро затухающий синус
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800 * pitch, now);
            osc.frequency.exponentialRampToValueAtTime(150 * pitch, now + 0.1);
            
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
            
            // Второй слой — короткий шум для "хруста"
            const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseData.length; i++) {
                noiseData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / noiseData.length, 3);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;
            
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.15, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 2000 * pitch;
            filter.Q.value = 2;
            
            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
            
            // "Булькающий" тон — с небольшой задержкой
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(300 * pitch, now + 0.02);
            osc2.frequency.exponentialRampToValueAtTime(600 * pitch, now + 0.08);
            
            gain2.gain.setValueAtTime(0.0001, now);
            gain2.gain.linearRampToValueAtTime(0.15, now + 0.03);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.02);
            osc2.stop(now + 0.15);
        }
        
        // Звук при наведении (лёгкий "дзынь")
        function playHoverSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1200, now);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }
        
        // ============ ИГРОВОЕ ПОЛЕ ============
        const ROWS = 6;
        const COLS = 6;
        const board = document.getElementById('board');
        const countEl = document.getElementById('count');
        let popCount = 0;
        
        // Палитра цветов для пузырьков
        const palettes = [
            { light: '#ffb3e6', base: '#ff6ec4', dark: '#cc3d9a', glow: 'rgba(255, 110, 196, 0.6)' },
            { light: '#b3d9ff', base: '#4a9eff', dark: '#2a6fcc', glow: 'rgba(74, 158, 255, 0.6)' },
            { light: '#d4b3ff', base: '#9d5eff', dark: '#7038cc', glow: 'rgba(157, 94, 255, 0.6)' },
            { light: '#b3ffe6', base: '#4adeaa', dark: '#2aa87a', glow: 'rgba(74, 222, 170, 0.6)' },
            { light: '#ffecb3', base: '#ffd54a', dark: '#cca62a', glow: 'rgba(255, 213, 74, 0.6)' },
            { light: '#ffb3b3', base: '#ff5e5e', dark: '#cc3d3d', glow: 'rgba(255, 94, 94, 0.6)' },
        ];
        
        function createBoard() {
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const bubble = document.createElement('button');
                    bubble.className = 'bubble';
                    
                    // Случайный цвет
                    const palette = palettes[(row * COLS + col) % palettes.length];
                    bubble.style.setProperty('--light', palette.light);
                    bubble.style.setProperty('--base', palette.base);
                    bubble.style.setProperty('--dark', palette.dark);
                    bubble.style.setProperty('--glow', palette.glow);
                    
                    // Задержка анимации для естественного парения
                    bubble.style.animationDelay = (Math.random() * 3) + 's';
                    
                    // Высота тона зависит от позиции (снизу вверх — выше)
                    const pitch = 0.7 + (1 - row / ROWS) * 0.8 + Math.random() * 0.1;
                    
                    bubble.addEventListener('click', () => {
                        if (bubble.classList.contains('pop')) return;
                        bubble.classList.add('pop');
                        playPopSound(pitch);
                        popCount++;
                        countEl.textContent = popCount;
                        createSparkles(bubble);
                    });
                    
                    bubble.addEventListener('mouseenter', () => {
                        if (!bubble.classList.contains('pop')) {
                            playHoverSound();
                        }
                    });
                    
                    board.appendChild(bubble);
                }
            }
        }
        
        // Создание эффекта разлетающихся частиц
        function createSparkles(el) {
            const rect = el.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const color = getComputedStyle(el).getPropertyValue('--base').trim();
            
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: fixed;
                    left: ${centerX}px;
                    top: ${centerY}px;
                    width: 8px;
                    height: 8px;
                    background: ${color};
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 999;
                    box-shadow: 0 0 10px ${color};
                `;
                document.body.appendChild(particle);
                
                const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.5;
                const distance = 40 + Math.random() * 40;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                
                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 600,
                    easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)'
                }).onfinish = () => particle.remove();
            }
        }
        
        // Кнопка сброса
        document.getElementById('resetBtn').addEventListener('click', () => {
            initAudio();
            createBoard();
            popCount = 0;
            countEl.textContent = 0;
        });
        
        // Фоновые плавающие пузырьки
        function createBgBubbles() {
            for (let i = 0; i < 15; i++) {
                const b = document.createElement('div');
                b.className = 'bg-bubble';
                const size = 20 + Math.random() * 60;
                b.style.width = size + 'px';
                b.style.height = size + 'px';
                b.style.left = Math.random() * 100 + 'vw';
                b.style.animationDuration = (15 + Math.random() * 20) + 's';
                b.style.animationDelay = (Math.random() * 15) + 's';
                document.body.appendChild(b);
            }
        }
        
        // Инициализация при первом взаимодействии
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });
        
        createBoard();
        createBgBubbles();
    </script>
</body>
</html>
